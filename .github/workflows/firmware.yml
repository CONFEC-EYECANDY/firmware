name: Firmware
on:
  push:
  workflow_dispatch:
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cli-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./tools/fw_cli
      - run: python -m unittest discover -s tools/fw_cli/tests -v
      - run: python -m unittest discover -s tools/tests -v
  build:
    needs: cli-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned ESP-IDF
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          git -C "$RUNNER_TEMP/esp-idf" checkout 4d59230ddff16327812782151ef0afef202dc6d7
          git -C "$RUNNER_TEMP/esp-idf" submodule update --init --recursive --depth 1
          "$RUNNER_TEMP/esp-idf/install.sh" esp32c3
      - name: Build and package firmware
        shell: bash
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python tools/build_variants.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c3
          path: dist/firmware/*.zip
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package CLI
        run: |
          python -m pip install build ./tools/fw_cli
          python -m build --wheel --outdir dist/cli tools/fw_cli
      - uses: actions/upload-artifact@v4
        with:
          name: fw-cli
          path: dist/cli/*.whl
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-esp32c3
          path: dist/firmware
      - uses: actions/download-artifact@v4
        with:
          name: fw-cli
          path: dist/cli
      - name: Publish complete public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; leaving the current release unchanged.'
            exit 0
          fi
          tag="fw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > dist/release-notes.md <<EOF_NOTES
          Automated ESP32-C3 build from commit ${GITHUB_SHA}.

          Download fw-install.sh (Linux/Termux) or fw-install.bat (Windows).
          Install Python 3.10+ first, then run the installer. No gh CLI or login is required for public repositories.

          Select a configuration: fw config a. Firmware downloads: fw update. Download, flash and monitor: fw go.
          See README.md for serial permissions and Android USB bridge requirements.
          EOF_NOTES
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Firmware ${GITHUB_SHA:0:12}" --notes-file dist/release-notes.md \
            dist/firmware/*.zip dist/cli/*.whl fw-install.sh fw-install.bat fw-install.py \
            fw-uninstall.sh fw-uninstall.bat fw-uninstall.py
          gh release edit "$tag" --draft=false --latest
