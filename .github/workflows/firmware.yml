name: Firmware
on:
  push:
  workflow_dispatch:
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IDF_REV: 4d59230ddff16327812782151ef0afef202dc6d7
      IDF_CCACHE_ENABLE: '1'
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Configure cache paths
        run: |
          echo "IDF_TOOLS_PATH=$RUNNER_TEMP/idf-tools" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/fw-ccache" >> "$GITHUB_ENV"
      - name: Cache ESP-IDF and toolchain
        id: idf-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/esp-idf
            ${{ env.IDF_TOOLS_PATH }}
          key: idf-v1-ubuntu24-${{ runner.arch }}-${{ env.IDF_REV }}-py${{ steps.python.outputs.python-version }}
      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ubuntu24-${{ runner.arch }}-${{ env.IDF_REV }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-ubuntu24-${{ runner.arch }}-${{ env.IDF_REV }}-
      - name: Ensure ccache is available
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ccache
          fi
      - name: Install pinned ESP-IDF
        if: steps.idf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          git -C "$RUNNER_TEMP/esp-idf" checkout "$IDF_REV"
          git -C "$RUNNER_TEMP/esp-idf" submodule update --init --recursive --depth 1
          "$RUNNER_TEMP/esp-idf/install.sh" esp32c3
      - name: Build and package firmware
        shell: bash
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          python tools/build_variants.py
          ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32c3
          path: dist/firmware/*.zip
          if-no-files-found: error
      - name: Package CLI
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist/cli tools/fw_cli
      - uses: actions/upload-artifact@v4
        with:
          name: fw-cli
          path: dist/cli/*.whl
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-esp32c3
          path: dist/firmware
      - uses: actions/download-artifact@v4
        with:
          name: fw-cli
          path: dist/cli
      - name: Publish complete public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; leaving the current release unchanged.'
            exit 0
          fi
          tag="fw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > dist/release-notes.md <<EOF_NOTES
          Automated ESP32-C3 build from commit ${GITHUB_SHA}.

          Download fw-install.sh (Linux/Termux) or fw-install.bat (Windows).
          Install Python 3.10+ first, then run the installer. No gh CLI or login is required for public repositories.

          Select a configuration: fw config a. Firmware downloads: fw update. Download, flash and monitor: fw go.
          See README.md for serial permissions and Android USB setup.
          EOF_NOTES
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Firmware ${GITHUB_SHA:0:12}" --notes-file dist/release-notes.md \
            dist/firmware/*.zip dist/cli/*.whl fw-install.sh fw-install.bat fw-install.py \
            fw-uninstall.sh fw-uninstall.bat fw-uninstall.py
          gh release edit "$tag" --draft=false --latest
