name: Tests (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "./tools/fw_cli[android]"
      - run: python -m unittest discover -s tools/fw_cli/tests -v
      - run: python -m unittest discover -s tools/tests -v
